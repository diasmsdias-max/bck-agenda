services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bck_agenda}
      POSTGRES_USER: ${POSTGRES_USER:-bck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bck_alpha_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bck} -d ${POSTGRES_DB:-bck_agenda}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - bck_alpha_pgdata:/var/lib/postgresql/data

volumes:
  bck_alpha_pgdata:
