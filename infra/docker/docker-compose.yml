services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bck_agenda}
      POSTGRES_USER: ${POSTGRES_USER:-bck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bck_dev_only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bck} -d ${POSTGRES_DB:-bck_agenda}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bck_pgdata:/var/lib/postgresql/data

volumes:
  bck_pgdata:
