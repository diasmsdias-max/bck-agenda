name: BCK EP04 Client HTTP
on: pull_request
jobs:
  client-http:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bck_agenda
          POSTGRES_USER: bck
          POSTGRES_PASSWORD: bck_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bck -d bck_agenda" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: bck_ci
      BCK_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=bck_agenda;Username=bck;Password=bck_ci
      ASPNETCORE_URLS: http://127.0.0.1:5080
      BCK_JWT_SIGNING_KEY: bck-agenda-ci-signing-key-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Migrate
        run: for f in database/migrations/*.sql; do psql -h localhost -U bck -d bck_agenda -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Start API
        run: |
          dotnet run --project server/src/Bck.Api/Bck.Api.csproj --no-launch-profile >/tmp/bck-api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:5080/api/v1/health >/dev/null && exit 0; sleep 1; done
          cat /tmp/bck-api.log; exit 1
      - name: Cross-tenant client isolation
        shell: bash
        run: |
          set -euo pipefail
          make_company(){
            local company=$1 user=$2 password=$3 device
            device=$(cat /proc/sys/kernel/random/uuid)
            local boot
            boot=$(curl -fsS -X POST http://127.0.0.1:5080/api/v1/bootstrap/company -H 'Content-Type: application/json' -d "{\"companyName\":\"$company\",\"ownerName\":\"$user\",\"ownerUsername\":\"$user\",\"password\":\"$password\",\"deviceId\":\"$device\",\"deviceName\":\"CI\",\"platform\":\"ANDROID\",\"deviceMode\":\"PERSONAL\"}")
            local group token
            group=$(echo "$boot" | jq -r .groupId)
            token=$(curl -fsS -X POST http://127.0.0.1:5080/api/v1/auth/login -H 'Content-Type: application/json' -d "{\"groupId\":\"$group\",\"username\":\"$user\",\"password\":\"$password\",\"deviceId\":\"$device\"}" | jq -r .accessToken)
            echo "$group|$token"
          }
          A=$(make_company 'EP04 A' 'ep04a' 'SenhaA123!')
          B=$(make_company 'EP04 B' 'ep04b' 'SenhaB123!')
          GA=${A%%|*}; TA=${A#*|}; GB=${B%%|*}; TB=${B#*|}; test "$GA" != "$GB"

          CLIENT_A=$(curl -fsS -X POST http://127.0.0.1:5080/api/v1/clients -H "Authorization: Bearer $TA" -H 'Content-Type: application/json' -d '{"name":"Cliente A","phone":"(27) 99999-0101","birthDate":"1990-05-20"}')
          ID_A=$(echo "$CLIENT_A" | jq -r .id); VER_A=$(echo "$CLIENT_A" | jq -r .version)
          test -n "$ID_A"; test "$ID_A" != null

          # Mesmo telefone normalizado em outro tenant deve ser permitido.
          curl -fsS -X POST http://127.0.0.1:5080/api/v1/clients -H "Authorization: Bearer $TB" -H 'Content-Type: application/json' -d '{"name":"Cliente B","phone":"27 99999-0101"}' >/dev/null

          # Tenant B não pode ler, alterar, excluir, consultar histórico ou reativar cliente A.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5080/api/v1/clients/$ID_A -H "Authorization: Bearer $TB")" = 404
          UPDATE=$(jq -nc --argjson v "$VER_A" '{name:"Intruso",phone:"27999990199",whatsAppEnabled:true,notes:null,birthDate:null,version:$v}')
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:5080/api/v1/clients/$ID_A -H "Authorization: Bearer $TB" -H 'Content-Type: application/json' -d "$UPDATE")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://127.0.0.1:5080/api/v1/clients/$ID_A -H "Authorization: Bearer $TB")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5080/api/v1/clients/$ID_A/history -H "Authorization: Bearer $TB")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5080/api/v1/clients/$ID_A/reactivate -H "Authorization: Bearer $TB")" = 404

          # Busca de duplicidade é limitada ao tenant autenticado.
          DUP_B=$(curl -fsS 'http://127.0.0.1:5080/api/v1/clients/duplicates?phone=27999990101' -H "Authorization: Bearer $TB")
          test "$(echo "$DUP_B" | jq '[.[] | select(.id=="'$ID_A'")] | length')" = 0

          # O cliente continua intacto no tenant A.
          OWN=$(curl -fsS http://127.0.0.1:5080/api/v1/clients/$ID_A -H "Authorization: Bearer $TA")
          test "$(echo "$OWN" | jq -r .name)" = 'Cliente A'
          test "$(echo "$OWN" | jq -r .birthDate)" = '1990-05-20'
