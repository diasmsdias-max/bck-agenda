name: BCK EP04 Client Database

on:
  pull_request:
    paths:
      - 'database/**'
      - 'server/src/Bck.Api/Features/Clients/**'
      - 'server/src/Bck.Api/Program.cs'
      - '.github/workflows/ep04-client-database.yml'

jobs:
  client-database-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bck_agenda
          POSTGRES_USER: bck
          POSTGRES_PASSWORD: bck_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bck -d bck_agenda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: bck_ci
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: |
          for migration in database/migrations/*.sql; do
            psql -h localhost -U bck -d bck_agenda -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify EP04 tenant isolation and phone contract
        run: psql -h localhost -U bck -d bck_agenda -v ON_ERROR_STOP=1 -f database/tests/ep04_client_tenant_isolation.sql
      - name: Verify EP04 client lifecycle contract
        run: psql -h localhost -U bck -d bck_agenda -v ON_ERROR_STOP=1 -f database/tests/ep04_client_lifecycle.sql
      - name: Verify EP04 history lifecycle contract
        run: psql -h localhost -U bck -d bck_agenda -v ON_ERROR_STOP=1 -f database/tests/ep04_client_history_lifecycle.sql
